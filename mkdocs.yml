# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: MCSR Ranked SDK
site_description: TypeScript SDK for the MCSR Ranked API
site_url: https://notava1ble.github.io/mcsrranked-sdk/
repo_url: https://github.com/Notava1ble/mcsrranked-sdk
repo_name: Notava1ble/mcsrranked-sdk
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: indigo
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Start here: index.md
  - Guides:
      - Get a player and their match history: guides/player-history.md
      - Browse and filter matches: guides/matches.md
      - Compare two players: guides/compare-players.md
      - Read the leaderboards: guides/leaderboards.md
      - Work with live matches and weekly races: guides/live-and-weekly-races.md
      - Use the SDK with React and Next.js: guides/react-and-nextjs.md
      - Handle errors: guides/error-handling.md
  - API reference:
      - Client: reference/client.md
      - Users: reference/users.md
      - Matches: reference/matches.md
      - Versus: reference/versus.md
      - Leaderboards: reference/leaderboards.md
      - Live: reference/live.md
      - Weekly races: reference/weekly-races.md
      - Status: reference/status.md
      - Errors: reference/errors.md
  - Advanced:
      - Authentication and private live data: advanced/authentication.md
      - Retries, timeouts, and cancellation: advanced/reliability.md
      - Response validation: advanced/validation.md
      - Custom fetch and raw requests: advanced/custom-requests.md

strict: true
